<html lang="ar" dir="rtl">
<head>

<style>

    --primary-dark:#204d43;
    --primary-light:#e6f0ed;
    --accent:#c99a4b;
    --bg:#faf8f4;

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:"Segoe UI","Tahoma","Arial",sans-serif;
    direction:rtl;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;

  #app{max-width:520px;margin:0 auto;padding:18px 16px 60px;min-height:100vh;}
  .wide #app{max-width:920px;}
  .brand{
    text-align:center;
    padding:22px 10px 18px;
  }
  .brand h1{
    font-size:34px;
    margin:0 0 4px;
    color:var(--primary-dark);
    letter-spacing:1px;
    font-weight:800;
  }
  .brand p{margin:0;color:var(--muted);font-size:14px;}
  .card{
    background:var(--card);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:20px;
    margin-bottom:16px;
    border:1px solid var(--border);

  .meeting-badge{
    display:inline-block;

  .meeting-meta b{color:var(--text);}

    width:100%;
    padding:13px 14px;
    border-radius:12px;

    font-size:16px;
    font-family:inherit;
    background:#fff;
    color:var(--text);

  .btn{
    display:block;
    width:100%;
    padding:15px;
    border-radius:14px;
    border:none;
    font-size:17px;
    font-weight:800;
    cursor:pointer;
    margin-top:12px;
    font-family:inherit;
    transition:transform .05s ease, opacity .15s ease;

  .btn:active{transform:scale(.98);}
  .btn-primary{background:var(--primary);color:#fff;}
  .btn-outline{background:#fff;color:var(--danger);border:1.5px solid var(--danger);}
  .btn-secondary{background:var(--primary-light);color:var(--primary-dark);}
  .btn-accent{background:var(--accent);color:#fff;}
  .btn-sm{padding:9px 14px;font-size:13.5px;border-radius:10px;margin-top:0;width:auto;display:inline-block;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .msg-success{
    background:#eaf5ef;color:var(--primary-dark);border-radius:14px;padding:22px;text-align:center;
    font-size:17px;font-weight:700;line-height:1.9;border:1px solid #cfe8db;

    background:#f6f1e6;color:#8a6a1f;border-radius:14px;padding:22px;text-align:center;

  .msg-already{

    font-size:15px;font-weight:700;margin-top:10px;border:1px solid #f4dcd3;

  .center{text-align:center;}
  .muted{color:var(--muted);font-size:13px;}
  .row{display:flex;gap:10px;}
  .row > *{flex:1;}
  .admin-link{
    display:block;width:100%;text-align:center;color:var(--muted);font-size:12.5px;margin-top:28px;
    text-decoration:none;background:none;border:none;font-family:inherit;cursor:pointer;padding:8px;

  .tabs{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;padding-bottom:4px;}
  .tab{
    padding:10px 16px;border-radius:12px;background:#fff;border:1.5px solid var(--border);

  .tab.active{background:var(--primary);color:#fff;border-color:var(--primary);}
  table{width:100%;border-collapse:collapse;font-size:13.5px;background:#fff;}
  th,td{padding:10px 8px;text-align:right;border-bottom:1px solid var(--border);}
  th{background:var(--primary-light);color:var(--primary-dark);font-weight:800;position:sticky;top:0;}
  tr:hover{background:#fafaf8;}
  .table-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--border);}
  .status-pill{padding:3px 10px;border-radius:20px;font-size:12px;font-weight:800;display:inline-block;}
  .pill-present{background:#e4f3ea;color:var(--ok);}
  .pill-excused{background:#fdf1e2;color:var(--warn);}
  .pill-absent{background:#fbe9e6;color:var(--danger);}

  .stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px;}
  .stat-box{background:#fff;border:1px solid var(--border);border-radius:12px;padding:12px 8px;text-align:center;}
  .stat-box .num{font-size:22px;font-weight:800;color:var(--primary-dark);}

  .meeting-item{

  .meeting-item.open{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-light);}
  .flex-between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
  .icon-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px;text-decoration:underline;padding:4px;}
  .top-actions{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .top-actions h2{margin:0;font-size:20px;color:var(--primary-dark);}
  .search-bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
  .search-bar select, .search-bar input{width:auto;flex:1;min-width:120px;margin-top:0;}
  .qr-box{text-align:center;padding:14px;background:#fff;border-radius:12px;border:1px solid var(--border);}
  .link-box{
    background:#f4f2ec;border-radius:10px;padding:10px 12px;font-size:12.5px;word-break:break-all;color:var(--muted);
    margin-top:8px;
  }
  .close-x{background:none;border:none;font-size:20px;color:var(--muted);cursor:pointer;}
  .loading{text-align:center;padding:40px;color:var(--muted);}
  .modal-overlay{
    position:fixed;inset:0;background:rgba(30,30,25,.45);
    display:flex;align-items:center;justify-content:center;padding:18px;z-index:1000;
  }
  .modal-card{
    background:#fff;border-radius:16px;padding:22px;max-width:420px;width:100%;
    box-shadow:0 10px 40px rgba(0,0,0,.25);max-height:88vh;overflow-y:auto;

  @media print{

<script>
/* ================= SUPABASE ================= */
const SUPABASE_URL = "https://xldkdlnxqngthttztonr.supabase.co";
const SUPABASE_KEY = "sb_publishable_WJv1H7lJZLhRNpQqx5PccQ_KCbZgDJP";

// Custom fetch: strips non-cloneable options (AbortSignal, Request objects, Headers instances)
// that can trigger "DataCloneError" inside the artifact sandbox's postMessage-based network proxy.
function safeFetch(input, init){
  init = init || {};
  const cleanInit = {};
  if(init.method) cleanInit.method = init.method;
  if(init.headers){
    const h = {};
    if(typeof Headers !== 'undefined' && init.headers instanceof Headers){
      init.headers.forEach((v,k)=>{ h[k]=v; });
    } else {
      Object.assign(h, init.headers);
    }
    cleanInit.headers = h;
  }
  if(init.body !== undefined) cleanInit.body = init.body;
  let url = input;
  if(typeof Request !== 'undefined' && input instanceof Request){
    url = input.url;
    if(!cleanInit.method) cleanInit.method = input.method;
  }
  return fetch(url, cleanInit);
}

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  global: { fetch: safeFetch },
  auth: { persistSession: false }
});

/* ================= DATA ================= */
const PARTICIPANTS = [
"أديم الجهني","أروى أبا الخيل","أروى الجنيدل","أروى السياري","أسماء الزاحم","آسية الجنيدل","آسية الحمدان",
"أفنان المهيدب","البندري العريفي","أمينة الشمري","أمينة المطرودي","أنفال العنزان","بتول الرومي","بشائر البداح",
"جواهر القحطاني","حفصة آدم","حنان الشثري","ديمة الكثيري","ربى السكيت","رند الزامل","رند الزايد","ريم الغميز",
"سارة إسماعيل","سارة الشهيل","سارة المديفر","سارة تركستاني","سعاد القاسم","سلمى الربيش","شعاع المشرف","شهد المرشود",
"غادة الدواس","فاطمة الجابر","فاطمة السلطان","فرح البداح","في الدرويش","كنده الجربوع","لانا الطحان","لجين القشعمي",
"لمى الصبحي","لمياء المطرودي","مريم الذويخ","منال الكاف","منيرة السليمان","منيرة الصقري","مها المهوس",
"نجد الموسى","نورة الدهام","نورة الزامل","نورة العجلان","هدى الدامغ","هدى الكثيري","هناء النفجان","هند المشرف"
];

const DEFAULT_PASSWORD = "2000";

/* ================= HIJRI CALENDAR (civil/tabular, "Kuwaiti algorithm") ================= */
const HIJRI_MONTHS = ["محرم","صفر","ربيع الأول","ربيع الآخر","جمادى الأولى","جمادى الآخرة","رجب","شعبان","رمضان","شوال","ذو القعدة","ذو الحجة"];
const WEEKDAYS_AR = ["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
const ARABIC_DIGITS = ["٠","١","٢","٣","٤","٥","٦","٧","٨","٩"];
function toArabicNumerals(n){ return String(n).split("").map(c=> /[0-9]/.test(c) ? ARABIC_DIGITS[c] : c).join(""); }

function gregorianToHijri(date){
  let day = date.getDate();
  let month = date.getMonth() + 1;
  let year = date.getFullYear();
  let m = month, y = year;
  if (m < 3) { y -= 1; m += 12; }
  let a = Math.floor(y / 100);
  let b = 2 - a + Math.floor(a / 4);
  let jd = Math.floor(365.25 * (y + 4716)) + Math.floor(30.6001 * (m + 1)) + day + b - 1524;
  let b2 = jd - 1948440 + 10632;
  let n = Math.floor((b2 - 1) / 10631);
  b2 = b2 - 10631 * n + 354;
  let j = Math.floor((10985 - b2) / 5316) * Math.floor((50 * b2) / 17719) + Math.floor(b2 / 5670) * Math.floor((43 * b2) / 15238);
  b2 = b2 - Math.floor((30 - j) / 15) * Math.floor((17719 * j) / 50) - Math.floor(j / 16) * Math.floor((15238 * j) / 43) + 29;
  let hMonth = Math.floor((24 * b2) / 709);
  let hDay = b2 - Math.floor((709 * hMonth) / 24);
  let hYear = 30 * n + j - 30;
  return { year: hYear, month: hMonth, day: hDay };
}
function hijriToGregorian(hYear, hMonth, hDay){
  let jd = Math.floor((11 * hYear + 3) / 30) + 354 * hYear + 30 * hMonth - Math.floor((hMonth - 1) / 2) + hDay + 1948440 - 385;
  let l = jd + 68569;
  let n = Math.floor((4 * l) / 146097);
  l = l - Math.floor((146097 * n + 3) / 4);
  let i = Math.floor((4000 * (l + 1)) / 1461001);
  l = l - Math.floor((1461 * i) / 4) + 31;
  let j = Math.floor((80 * l) / 2447);
  let day = l - Math.floor((2447 * j) / 80);
  l = Math.floor(j / 11);
  let month = j + 2 - 12 * l;
  let year = 100 * (n - 49) + i + l;
  return new Date(year, month - 1, day);
}
function isoFromHijri(hYear, hMonth, hDay){
  const g = hijriToGregorian(hYear, hMonth, hDay);
  const y = g.getFullYear(), m = String(g.getMonth()+1).padStart(2,"0"), d = String(g.getDate()).padStart(2,"0");
  return `${y}-${m}-${d}`;
}
function hijriDateSelectorHtml(idPrefix, isoDate, weekday){
  const base = isoDate ? new Date(isoDate+"T00:00:00") : new Date();
  const dH = gregorianToHijri(base);
  const days = Array.from({length:30}, (_,i)=>i+1);
  const todayH = gregorianToHijri(new Date());
  const years = [];
  for(let y = todayH.year - 1; y <= todayH.year + 3; y++) years.push(y);
  return `
    <div class="row">
      <div>
        <label>اليوم</label>
        <select id="${idPrefix}Day">
          ${days.map(d=>`<option value="${d}" ${d===dH.day?'selected':''}>${toArabicNumerals(d)}</option>`).join("")}
        </select>
      </div>
      <div>
        <label>الشهر</label>
        <select id="${idPrefix}Month">
          ${HIJRI_MONTHS.map((m,i)=>`<option value="${i+1}" ${(i+1)===dH.month?'selected':''}>${m}</option>`).join("")}
        </select>
      </div>
      <div>
        <label>السنة</label>
        <select id="${idPrefix}Year">
          ${years.map(y=>`<option value="${y}" ${y===dH.year?'selected':''}>${toArabicNumerals(y)} هـ</option>`).join("")}
        </select>
      </div>
    </div>
    <label>يوم الأسبوع</label>
    <select id="${idPrefix}Weekday">
      ${WEEKDAYS_AR.map(w=>`<option value="${w}" ${w===weekday?'selected':''}>${w}</option>`).join("")}
    </select>`;
}
function readWeekdaySelector(idPrefix){
  return document.getElementById(idPrefix+"Weekday").value;
}
function readHijriSelector(idPrefix){
  const day = parseInt(document.getElementById(idPrefix+"Day").value, 10);
  const month = parseInt(document.getElementById(idPrefix+"Month").value, 10);
  const year = parseInt(document.getElementById(idPrefix+"Year").value, 10);
  return isoFromHijri(year, month, day);
}

let state = {
  meetings: [],
  attendanceByMeeting: {},   // { meetingId: { participantName: {status, recorded_at} } }
  adminPassword: DEFAULT_PASSWORD,
  isAdmin: false,
  route: "#/",
  adminTab: "meetings",
  selectedMeetingLog: null,
  storageError: false,
  lastError: "",
  selectedName: "",
  editingAttendance: false,
  loading: true
};

/* ================= SUPABASE HELPERS ================= */
async function loadAll(){
  state.loading = true;
  try{
    const { data: meetings, error: mErr } = await sb.from('meetings').select('*').order('created_at', {ascending:false});
    if(mErr) throw mErr;
    state.meetings = meetings || [];

    const { data: att, error: aErr } = await sb.from('attendance').select('*');
    if(aErr) throw aErr;
    state.attendanceByMeeting = {};
    (att||[]).forEach(r=>{
      if(!state.attendanceByMeeting[r.meeting_id]) state.attendanceByMeeting[r.meeting_id] = {};
      state.attendanceByMeeting[r.meeting_id][r.participant_name] = { status: r.status, recorded_at: r.recorded_at, id: r.id };
    });

    const { data: settings, error: sErr } = await sb.from('admin_settings').select('*').eq('id', 1).maybeSingle();
    if(sErr) throw sErr;
    state.adminPassword = settings ? settings.password : DEFAULT_PASSWORD;

    state.storageError = false;
  }catch(e){
    state.storageError = true;
    state.lastError = (e && e.message) ? e.message : String(e);
  }
  state.loading = false;
}

async function createMeetingDB(mt){
  const { error } = await sb.from('meetings').insert({
    title: mt.title, type: mt.type, date: mt.date, time: mt.time, location: mt.location,
    status: 'open', opened_at: new Date().toISOString()
  });
  if(error){ state.lastError = error.message; return false; }
  return true;
}
async function toggleMeetingDB(mt){
  const newStatus = mt.status==='open' ? 'closed' : 'open';
  const patch = { status: newStatus };
  if(newStatus==='open') patch.opened_at = new Date().toISOString();
  const { error } = await sb.from('meetings').update(patch).eq('id', mt.id);
  if(error){ state.lastError = error.message; return false; }
  return true;
}
async function submitAttendanceDB(meetingId, name, status){
  const { error } = await sb.from('attendance').upsert({
    meeting_id: meetingId,
    participant_name: name,
    status: status,
    recorded_at: new Date().toISOString()
  }, { onConflict: 'meeting_id,participant_name' });
  if(error){ state.lastError = error.message; return false; }
  return true;
}
async function savePasswordDB(pw){
  const { error } = await sb.from('admin_settings').update({password: pw}).eq('id', 1);
  if(error){ state.lastError = error.message; return false; }
  state.adminPassword = pw;
  return true;
}

/* ================= UTIL ================= */
function fmtDate(dateStr, weekday){
  if(!dateStr) return "-";
  const d = new Date(dateStr+"T00:00:00");
  const h = gregorianToHijri(d);
  const wd = weekday || WEEKDAYS_AR[d.getDay()];
  return `${wd}، ${toArabicNumerals(h.day)} ${HIJRI_MONTHS[h.month-1]} ${toArabicNumerals(h.year)} هـ`;
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
/* Encode weekday + time together into the existing 'time' text column, so no DB schema change is needed.
   Format stored: "الاثنين||08:00"  (backward compatible: old rows without "||" just have plain time) */
function packTimeWeekday(weekday, time){
  return (weekday||'') + '||' + (time||'');
}
function unpackTimeWeekday(raw){
  if(!raw) return { weekday:null, time:'' };
  if(raw.indexOf('||') === -1) return { weekday:null, time:raw };
  const parts = raw.split('||');
  return { weekday: parts[0]||null, time: parts.slice(1).join('||') };
}
function isMeetingOpen(mt){ return mt && mt.status === 'open'; }
function isMeetingClosedFinal(mt){ return mt && mt.status === 'closed'; }
function getCurrentOpenMeeting(){
  const open = state.meetings.filter(isMeetingOpen);
  if(open.length===0) return null;
  open.sort((a,b)=> new Date(b.opened_at||b.created_at) - new Date(a.opened_at||a.created_at));
  return open[0];
}
function getAttendanceRecord(meetingId, name){
  return (state.attendanceByMeeting[meetingId] && state.attendanceByMeeting[meetingId][name]) || null;
}

/* ================= RENDER: PUBLIC ================= */
function renderPublic(){
  const mt = getCurrentOpenMeeting();
  let html = `<div class="brand"><h1>إبانة</h1><p>مجالس العقيدة الطحاوية</p></div>`;

  if(!mt){
    html += `<div class="card"><div class="msg-closed">لا يوجد لقاء مفتوح للتسجيل في الوقت الحالي.<br>تحقّقي لاحقاً أو تواصلي مع المشرفة.</div></div>`;
  } else {
    const badgeClass = mt.type === 'virtual' ? 'badge-virtual' : 'badge-onsite';
    const badgeLabel = mt.type === 'virtual' ? 'لقاء عن بُعد' : 'لقاء حضوري';
    const tw = unpackTimeWeekday(mt.time);
    html += `<div class="card">
      <span class="meeting-badge ${badgeClass}">${badgeLabel}</span>
      <div class="meeting-title">${escapeHtml(mt.title)}</div>
      <div class="meeting-meta">
        <div>📅 <b>${fmtDate(mt.date, tw.weekday)}</b></div>
        <div>🕐 الساعة: <b>${escapeHtml(tw.time||'-')}</b></div>
        <div>📍 ${mt.type==='virtual'?'الرابط':'المكان'}: <b>${escapeHtml(mt.location||'-')}</b></div>
      </div>
    </div>`;

    html += `<div class="card">
      <label>اختاري اسمك من القائمة</label>
      <select id="nameSelect" onchange="onNameSelect()">
        <option value="">-- اختاري --</option>
        ${PARTICIPANTS.map(n=>`<option value="${escapeHtml(n)}" ${state.selectedName===n?'selected':''}>${escapeHtml(n)}</option>`).join('')}
      </select>
      <div id="statusArea">${renderStatusArea(mt)}</div>
    </div>`;
  }

  html += `<button class="admin-link" onclick="goAdmin()">لوحة الإدارة</button>`;
  return html;
}

function renderStatusArea(mt){
  if(!state.selectedName) return '';
  const rec = getAttendanceRecord(mt.id, state.selectedName);

  if(rec && !state.editingAttendance){
    const label = rec.status==='present'?'حاضرة':rec.status==='excused'?'اعتذر':'غائبة';
    const pillClass = rec.status==='present'?'pill-present':rec.status==='excused'?'pill-excused':'pill-absent';
    return `
      <div class="msg-already">
        حالتكِ لهذا اللقاء مُسجّلة مسبقاً: <span class="status-pill ${pillClass}">${label}</span>
      </div>
      <button class="btn btn-secondary" onclick="startEdit()">تعديل الحالة</button>
    `;
  }

  return `
    <label>سجّلي حالتك لهذا اللقاء</label>
    <div class="row" style="margin-top:8px;">
      <button class="btn btn-primary" onclick="submitAttendance('present')">حاضرة</button>
      <button class="btn btn-secondary" onclick="submitAttendance('excused')">اعتذر</button>
    </div>
    ${rec ? `<button class="btn" style="background:none;color:var(--muted);text-decoration:underline;" onclick="cancelEdit()">إلغاء</button>` : ''}
  `;
}

function onNameSelect(){
  const sel = document.getElementById('nameSelect');
  state.selectedName = sel.value;
  state.editingAttendance = false;
  render();
}
function startEdit(){ state.editingAttendance = true; render(); }
function cancelEdit(){ state.editingAttendance = false; render(); }

async function submitAttendance(status){
  const mt = getCurrentOpenMeeting();
  if(!mt || !state.selectedName) return;
  const ok = await submitAttendanceDB(mt.id, state.selectedName, status);
  if(ok){
    if(!state.attendanceByMeeting[mt.id]) state.attendanceByMeeting[mt.id] = {};
    state.attendanceByMeeting[mt.id][state.selectedName] = { status, recorded_at: new Date().toISOString() };
    state.editingAttendance = false;
    state.storageError = false;
  } else {
    state.storageError = true;
  }
  render();
}

/* ================= NAV ================= */
function goAdmin(){ state.route = '#/admin'; render(); }
function goHome(){ state.route = '#/'; state.selectedName=''; state.editingAttendance=false; document.body.classList.remove('wide'); render(); }

/* ================= RENDER: ADMIN ================= */
function renderAdmin(){
  if(!state.isAdmin) return renderAdminLogin();
  document.body.classList.add('wide');
  let html = `<div class="top-actions"><h2>لوحة إدارة إبانة</h2><button class="icon-btn" onclick="adminLogout()">تسجيل الخروج</button></div>`;
  html += `<div class="tabs">
    <div class="tab ${state.adminTab==='meetings'?'active':''}" onclick="setAdminTab('meetings')">اللقاءات</div>
    <div class="tab ${state.adminTab==='stats'?'active':''}" onclick="setAdminTab('stats')">الإحصاءات</div>
    <div class="tab ${state.adminTab==='settings'?'active':''}" onclick="setAdminTab('settings')">الإعدادات</div>
  </div>`;
  if(state.adminTab==='meetings') html += renderAdminMeetings();
  else if(state.adminTab==='stats') html += renderAdminStats();
  else html += renderAdminSettings();
  html += `<button class="admin-link" onclick="goHome()">العودة لصفحة التسجيل</button>`;
  return html;
}

function renderAdminLogin(){
  document.body.classList.remove('wide');
  return `<div class="brand"><h1>إبانة</h1><p>لوحة الإدارة</p></div>
    <div class="card">
      <label>كلمة المرور</label>
      <input type="password" id="adminPw" placeholder="أدخلي كلمة المرور" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
      <div class="field-error" id="pwError"></div>
      <button class="btn btn-primary" onclick="tryAdminLogin()">دخول</button>
      <button class="admin-link" onclick="goHome()">العودة</button>
    </div>`;
}
function tryAdminLogin(){
  const val = document.getElementById('adminPw').value.trim();
  if(val === String(state.adminPassword).trim()){
    state.isAdmin = true;
    render();
  } else {
    document.getElementById('pwError').textContent = 'كلمة المرور غير صحيحة';
  }
}
function adminLogout(){ state.isAdmin=false; document.body.classList.remove('wide'); render(); }
function setAdminTab(t){ state.adminTab=t; state.selectedMeetingLog=null; render(); }

function renderAdminMeetings(){
  let html = `<button class="btn btn-accent" onclick="openMeetingModal()">+ إنشاء لقاء جديد</button>`;
  if(state.meetings.length===0){
    html += `<div class="card center muted">لا توجد لقاءات بعد</div>`;
  }
  state.meetings.forEach(mt=>{
    const open = isMeetingOpen(mt);
    const badgeLabel = mt.type==='virtual'?'عن بُعد':'حضوري';
    const attCount = Object.keys(state.attendanceByMeeting[mt.id]||{}).length;
    html += `<div class="meeting-item ${open?'open':''}">
      <div class="flex-between">
        <div>
          <b>${escapeHtml(mt.title)}</b>
          <div class="muted" style="font-size:12.5px;margin-top:2px;">${badgeLabel} • ${fmtDate(mt.date, unpackTimeWeekday(mt.time).weekday)}</div>
        </div>
        <span class="status-pill ${open?'pill-present':'pill-pending'}">${open?'مفتوح':'مغلق'}</span>
      </div>
      <div class="row" style="margin-top:10px;">
        <button class="btn btn-sm ${open?'btn-outline':'btn-secondary'}" onclick="toggleMeeting('${mt.id}')">${open?'إغلاق التسجيل':'فتح التسجيل'}</button>
        <button class="btn btn-sm btn-secondary" onclick="viewLog('${mt.id}')">${state.selectedMeetingLog===mt.id?'إخفاء السجل':'السجل'} (${toArabicNumerals(attCount)})</button>
      </div>
      <button class="btn btn-sm btn-secondary" style="margin-top:8px;width:100%;" onclick="openEditMeetingModal('${mt.id}')">تعديل بيانات اللقاء</button>
    </div>`;
    if(state.selectedMeetingLog===mt.id){
      html += renderMeetingLog(mt.id);
    }
  });
  return html;
}

function openMeetingModal(){
  const modal = document.getElementById('modalRoot');
  modal.innerHTML = `<div class="modal-overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal-card">
      <div class="flex-between"><h3>لقاء جديد</h3><button class="close-x" onclick="closeModal()">×</button></div>
      <label>عنوان اللقاء</label>
      <input type="text" id="mTitle" placeholder="مثال: اللقاء الشهري - الثاني">
      <label>نوع اللقاء</label>
      <select id="mType" onchange="document.getElementById('mLocLabel').textContent = this.value==='virtual' ? 'رابط اللقاء (Zoom)' : 'المكان';">
        <option value="onsite">حضوري</option>
        <option value="virtual">عن بُعد</option>
      </select>
      <label>التاريخ (هجري)</label>
      ${hijriDateSelectorHtml('mDate','', WEEKDAYS_AR[new Date().getDay()])}
      <label>الوقت</label>
      <input type="text" id="mTime" placeholder="مثال: 08:00">
      <label id="mLocLabel">المكان</label>
      <input type="text" id="mLoc" placeholder="مركز الهمة العليا">
      <div class="field-error" id="mError"></div>
      <button class="btn btn-primary" onclick="createMeeting()">إنشاء وفتح اللقاء</button>
    </div>
  </div>`;
}
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }

function openEditMeetingModal(id){
  const mt = state.meetings.find(m=>m.id===id);
  if(!mt) return;
  const tw = unpackTimeWeekday(mt.time);
  const modal = document.getElementById('modalRoot');
  modal.innerHTML = `<div class="modal-overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal-card">
      <div class="flex-between"><h3>تعديل بيانات اللقاء</h3><button class="close-x" onclick="closeModal()">×</button></div>
      <label>عنوان اللقاء</label>
      <input type="text" id="emTitle" value="${escapeHtml(mt.title)}">
      <label>نوع اللقاء</label>
      <select id="emType" onchange="document.getElementById('emLocLabel').textContent = this.value==='virtual' ? 'رابط اللقاء (Zoom)' : 'المكان';">
        <option value="onsite" ${mt.type==='onsite'?'selected':''}>حضوري</option>
        <option value="virtual" ${mt.type==='virtual'?'selected':''}>عن بُعد</option>
      </select>
      <label>التاريخ (هجري)</label>
      ${hijriDateSelectorHtml('emDate', mt.date, tw.weekday || WEEKDAYS_AR[new Date(mt.date+"T00:00:00").getDay()])}
      <label>الوقت</label>
      <input type="text" id="emTime" value="${escapeHtml(tw.time||'')}">
      <label id="emLocLabel">${mt.type==='virtual'?'رابط اللقاء (Zoom)':'المكان'}</label>
      <input type="text" id="emLoc" value="${escapeHtml(mt.location||'')}">
      <div class="field-error" id="emError"></div>
      <button class="btn btn-primary" onclick="saveEditedMeeting('${id}')">حفظ التعديلات</button>
    </div>
  </div>`;
}
async function saveEditedMeeting(id){
  const title = document.getElementById('emTitle').value.trim();
  const type = document.getElementById('emType').value;
  const timeRaw = document.getElementById('emTime').value.trim();
  const loc = document.getElementById('emLoc').value.trim();
  if(!title){ document.getElementById('emError').textContent='الرجاء إدخال عنوان اللقاء'; return; }
  const date = readHijriSelector('emDate');
  const weekday = readWeekdaySelector('emDate');
  const time = packTimeWeekday(weekday, timeRaw);
  const { error } = await sb.from('meetings').update({title, type, date, time, location: loc}).eq('id', id);
  const err = document.getElementById('emError');
  if(!error){
    await loadAll();
    closeModal();
    render();
  } else if(err){
    err.innerHTML = '⚠️ تعذّر الحفظ. الخطأ: <span style="direction:ltr;display:inline-block;">' + escapeHtml(error.message||'') + '</span>';
  }
}

async function createMeeting(){
  const title = document.getElementById('mTitle').value.trim();
  const type = document.getElementById('mType').value;
  const timeRaw = document.getElementById('mTime').value.trim();
  const loc = document.getElementById('mLoc').value.trim();
  if(!title){ document.getElementById('mError').textContent='الرجاء إدخال عنوان اللقاء'; return; }
  const date = readHijriSelector('mDate');
  const weekday = readWeekdaySelector('mDate');
  const time = packTimeWeekday(weekday, timeRaw);
  const ok = await createMeetingDB({title, type, date, time, location: loc});
  const err = document.getElementById('mError');
  if(ok){
    await loadAll();
    closeModal();
    render();
  } else if(err){
    err.innerHTML = '⚠️ تعذّر حفظ اللقاء. الخطأ: <span style="direction:ltr;display:inline-block;">' + escapeHtml(state.lastError||'') + '</span>';
  }
}

async function toggleMeeting(id){
  const mt = state.meetings.find(m=>m.id===id);
  if(!mt) return;
  const ok = await toggleMeetingDB(mt);
  if(ok){ await loadAll(); }
  render();
}

function viewLog(id){
  state.selectedMeetingLog = state.selectedMeetingLog===id ? null : id;
  render();
}
function renderMeetingLog(id){
  const mt = state.meetings.find(m=>m.id===id);
  if(!mt) return '';
  const records = state.attendanceByMeeting[id] || {};
  const closed = isMeetingClosedFinal(mt);
  const present = PARTICIPANTS.filter(n=>records[n]?.status==='present').length;
  const excused = PARTICIPANTS.filter(n=>records[n]?.status==='excused').length;
  const absent = PARTICIPANTS.filter(n=>{
    const rec = records[n];
    if(rec) return rec.status==='absent';
    return closed;
  }).length;
  let html = `<div class="card">
    <div class="stat-grid" style="margin-top:0;">
      <div class="stat-box"><div class="num">${toArabicNumerals(present)}</div><div class="lbl">حاضرات</div></div>
      <div class="stat-box"><div class="num">${toArabicNumerals(excused)}</div><div class="lbl">اعتذرن</div></div>
      <div class="stat-box"><div class="num">${toArabicNumerals(absent)}</div><div class="lbl">غائبات</div></div>
    </div>
    <div class="table-wrap"><table><thead><tr><th>الاسم</th><th>الحالة</th><th></th></tr></thead><tbody>`;
  PARTICIPANTS.forEach(n=>{
    const rec = records[n];
    let status = rec?.status;
    if(!status){ status = closed ? 'absent' : 'pending'; }
    const label = status==='present'?'حاضرة':status==='excused'?'اعتذر':status==='absent'?'غائبة':'لم تسجّل';
    const cls = status==='present'?'pill-present':status==='excused'?'pill-excused':status==='absent'?'pill-absent':'pill-pending';
    html += `<tr>
      <td>${escapeHtml(n)}</td>
      <td><span class="status-pill ${cls}">${label}</span></td>
      <td><button class="icon-btn" onclick="openEditRecordModal('${id}','${escapeHtml(n).replace(/'/g,"\\'")}')">تعديل</button></td>
    </tr>`;
  });
  html += `</tbody></table></div></div>`;
  return html;
}

function openEditRecordModal(meetingId, name){
  const modal = document.getElementById('modalRoot');
  const rec = getAttendanceRecord(meetingId, name);
  const current = rec ? rec.status : '';
  modal.innerHTML = `<div class="modal-overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal-card">
      <div class="flex-between"><h3>تعديل حالة: ${escapeHtml(name)}</h3><button class="close-x" onclick="closeModal()">×</button></div>
      <div class="row" style="margin-top:10px;">
        <button class="btn btn-primary" onclick="adminSetStatus('${meetingId}','${escapeHtml(name).replace(/'/g,"\\'")}','present')">حاضرة</button>
        <button class="btn btn-outline" onclick="adminSetStatus('${meetingId}','${escapeHtml(name).replace(/'/g,"\\'")}','absent')">غائبة</button>
      </div>
      <button class="btn btn-secondary" onclick="adminSetStatus('${meetingId}','${escapeHtml(name).replace(/'/g,"\\'")}','excused')">اعتذر</button>
      <div class="field-error" id="editError"></div>
    </div>
  </div>`;
}
async function adminSetStatus(meetingId, name, status){
  const ok = await submitAttendanceDB(meetingId, name, status);
  if(ok){
    if(!state.attendanceByMeeting[meetingId]) state.attendanceByMeeting[meetingId] = {};
    state.attendanceByMeeting[meetingId][name] = { status, recorded_at: new Date().toISOString() };
    closeModal();
    render();
  } else {
    const err = document.getElementById('editError');
    if(err) err.textContent = 'تعذّر الحفظ: ' + (state.lastError||'');
  }
}

function renderAdminStats(){
  const totalMeetings = state.meetings.length;
  const closedMeetings = state.meetings.filter(isMeetingClosedFinal);
  const totalParticipants = PARTICIPANTS.length;
  let totalPresent=0, totalExcused=0, totalAbsent=0;
  state.meetings.forEach(mt=>{
    const records = state.attendanceByMeeting[mt.id]||{};
    let mtPresent=0, mtExcused=0;
    PARTICIPANTS.forEach(n=>{
      const r = records[n];
      if(r && r.status==='present') mtPresent++;
      else if(r && r.status==='excused') mtExcused++;
    });
    totalPresent += mtPresent;
    totalExcused += mtExcused;
    if(isMeetingClosedFinal(mt)){
      totalAbsent += (PARTICIPANTS.length - mtPresent - mtExcused);
    }
  });
  const totalCounted = totalPresent + totalExcused + totalAbsent;
  const rate = totalCounted ? Math.round((totalPresent/totalCounted)*100) : 0;
  return `<div class="stat-grid">
    <div class="stat-box"><div class="num">${toArabicNumerals(totalExcused)}</div><div class="lbl">معتذرات</div></div>
    <div class="stat-box"><div class="num">${toArabicNumerals(totalPresent)}</div><div class="lbl">حاضرات</div></div>
    <div class="stat-box"><div class="num">${toArabicNumerals(totalParticipants)}</div><div class="lbl">إجمالي المشاركات</div></div>
  </div>
  <div class="stat-grid">
    <div class="stat-box"><div class="num">${toArabicNumerals(closedMeetings.length)}</div><div class="lbl">لقاءات منعقدة</div></div>
    <div class="stat-box"><div class="num">${rate}%</div><div class="lbl">نسبة الحضور</div></div>
    <div class="stat-box"><div class="num">${toArabicNumerals(totalAbsent)}</div><div class="lbl">غائبات</div></div>
  </div>
  <div class="card center muted">إجمالي اللقاءات المنشأة: ${toArabicNumerals(totalMeetings)}</div>`;
}

function renderAdminSettings(){
  return `<div class="card">
    <label>تغيير كلمة مرور الإدارة</label>
    <input type="password" id="newPw" placeholder="كلمة المرور الجديدة" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
    <div class="field-error" id="pwSaveMsg"></div>
    <button class="btn btn-primary" onclick="changePw()">حفظ</button>
  </div>`;
}
async function changePw(){
  const val = document.getElementById('newPw').value.trim();
  if(!val){ document.getElementById('pwSaveMsg').textContent='أدخلي كلمة مرور'; return; }
  const ok = await savePasswordDB(val);
  const msg = document.getElementById('pwSaveMsg');
  msg.style.color = ok ? 'var(--ok)' : 'var(--danger)';
  msg.textContent = ok ? 'تم الحفظ بنجاح' : ('تعذّر الحفظ: ' + (state.lastError||''));
}

/* ================= MAIN RENDER ================= */
function renderConnErrorBanner(){
  if(!state.storageError) return '';
  return `<div class="msg-already" style="margin-bottom:14px;">
    ⚠️ تعذّر الاتصال بقاعدة البيانات.
    <div class="muted" style="margin-top:8px;font-size:11.5px;direction:ltr;text-align:center;">${escapeHtml(state.lastError||'')}</div>
    <button class="btn btn-outline" style="margin-top:10px;" onclick="retryLoad()">إعادة المحاولة</button>
  </div>`;
}
async function retryLoad(){ await loadAll(); render(); }

function render(){
  const app = document.getElementById('app');
  if(state.loading){
    app.innerHTML = `<div class="loading">جاري التحميل...</div>`;
    return;
  }
  const banner = renderConnErrorBanner();
  if(state.route==='#/admin'){
    app.innerHTML = banner + renderAdmin();
  } else {
    document.body.classList.remove('wide');
    app.innerHTML = banner + renderPublic();
  }
}

/* ================= INIT ================= */
(async function init(){
  await loadAll();
  render();
})();
</script>
